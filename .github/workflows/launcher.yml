name: Сборка лаунчера

# Запуск: вручную (вкладка Actions, кнопка Run workflow) или тегом вида launcher-v0.1.0.
# Тег создаёт релиз на GitHub и прикладывает к нему установщики для Windows и Linux.
on:
  push:
    tags: ["launcher-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: ubuntu-22.04
            name: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri

      - name: Системные библиотеки Linux
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - run: npm ci

      - name: Тесты (докачка, хэш, распаковка)
        working-directory: launcher/src-tauri
        run: cargo test

      - name: Сборка
        run: npx tauri build

      - name: Собрать файлы релиза (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force ../dist-release | Out-Null
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $setup.FullName "../dist-release/ShozitLauncher-v$v-windows-setup.exe"
          Compress-Archive -Path src-tauri/target/release/shozit-launcher.exe -DestinationPath "../dist-release/ShozitLauncher-v$v-windows-portable.zip"

      - name: Собрать файлы релиза (Linux)
        if: matrix.name == 'linux'
        run: |
          v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mkdir -p ../dist-release
          cp src-tauri/target/release/bundle/appimage/*.AppImage "../dist-release/ShozitLauncher-v${v}-linux.AppImage"
          cp src-tauri/target/release/bundle/deb/*.deb "../dist-release/ShozitLauncher-v${v}-linux.deb"

      - name: Контрольные суммы SHA-256
        shell: bash
        working-directory: dist-release
        run: |
          for f in *; do
            if command -v sha256sum >/dev/null; then sha256sum "$f"; else shasum -a 256 "$f"; fi
          done | tee "SHA256-${{ matrix.name }}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ matrix.name }}
          path: dist-release/*

  release:
    if: startsWith(github.ref, 'refs/tags/launcher-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Лаунчер ${{ github.ref_name }}
          files: dist/*
