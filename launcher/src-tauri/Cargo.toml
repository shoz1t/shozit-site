[package]
name = "shozit-launcher"
version = "0.1.0"
description = "Лаунчер Shozit Developments"
authors = ["Shozit Developments"]
edition = "2021"

[lib]
name = "shozit_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls вместо OpenSSL: проще собирать под Linux и Windows
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
fs2 = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
tokio = { version = "1", features = ["fs", "io-util", "time", "macros", "rt-multi-thread"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
